apiVersion: apps/v1
kind: Deployment
metadata:
  name: cia2-java-app
  labels:
    app: cia2-java-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app: cia2-java-app
  template:
    metadata:
      labels:
        app: cia2-java-app
    spec:
      containers:
        - name: java-web
          # Replace with your lowercase GHCR image and a real commit SHA tag.
          image: ghcr.io/your-github-username/your-repository:REPLACE_WITH_COMMIT_SHA
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: APP_VERSION
              value: "replace-with-commit-sha"
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 500m
              memory: 512Mi
---
apiVersion: v1
kind: Service
metadata:
  name: cia2-java-service
spec:
  type: NodePort
  selector:
    app: cia2-java-app
  ports:
    - name: http
      port: 80
      targetPort: http
      nodePort: 30080
