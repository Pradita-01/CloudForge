---
- name: Install a single-node K3s Kubernetes cluster for the CIA 2 demo
  hosts: kubernetes
  become: true
  tasks:
    - name: Install K3s
      ansible.builtin.shell: curl -sfL https://get.k3s.io | sh -
      args:
        creates: /usr/local/bin/k3s

    - name: Wait for K3s node to become ready
      ansible.builtin.command: /usr/local/bin/kubectl get nodes
      register: k3s_nodes
      changed_when: false
      retries: 12
      delay: 10
      until: k3s_nodes.rc == 0
