
# CloudForge - Azure DevOps CI/CD Pipeline
# Integrated with Gitleaks and SonarQube Cloud

trigger:
  branches:
    include:
      - main
      - feature/sonarqube-integration

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-24.04

variables:
  JAVA_VERSION: '21'
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  DOCKER_IMAGE: cloudforge:$(Build.BuildId)
  GHCR_IMAGE: ghcr.io/pradita-01/cloudforge
  GHCR_USER: Pradita-01

  # Keep Kubernetes deployment disabled during SonarQube validation.
  ENABLE_K8S_DEPLOYMENT: 'false'

  # Keep GHCR publishing disabled during validation.
  ENABLE_GHCR_PUBLISH: 'false'

steps:

# 1. Checkout source code with full Git history
- checkout: self
  fetchDepth: 0
  displayName: 'Checkout CloudForge source'

# 2. Configure Java 21
- task: JavaToolInstaller@0
  displayName: 'Set up JDK 21'
  inputs:
    versionSpec: '21'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

# 3. Cache Maven dependencies
- task: Cache@2
  displayName: 'Cache Maven dependencies'
  inputs:
    key: 'maven | "$(Agent.OS)" | pom.xml'
    restoreKeys: |
      maven | "$(Agent.OS)"
    path: $(MAVEN_CACHE_FOLDER)

# 4. Gitleaks secret scanning
- script: |
    docker run --rm \
      -v "$(Build.SourcesDirectory):/repo" \
      ghcr.io/gitleaks/gitleaks:v8.24.3 \
      detect --source=/repo --redact --verbose --exit-code 1
  displayName: 'Gitleaks secret scanning'
  continueOnError: true

# 5. Prepare SonarQube Cloud analysis ONLY on main
- task: SonarCloudPrepare@4
  displayName: 'Prepare SonarQube Cloud analysis'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    SonarCloud: 'CloudForge-SonarQube-Connection'
    organization: 'pradita-01'
    scannerMode: 'other'
    extraProperties: |
      sonar.projectKey=Pradita-01_CloudForge
      sonar.maven.scanAll=true
      sonar.text.inclusions=**/*.txt
      sonar.text.inclusions.activate=true

# 6A. Maven build, tests and SonarQube analysis on main
- task: Maven@4
  displayName: 'Maven build, tests and SonarQube analysis'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean verify'
    options: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
    publishJUnitResults: false
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.21'
    mavenVersionOption: 'Default'
    mavenAuthenticateFeed: false
    effectivePomSkip: false
    sonarQubeRunAnalysis: true
    sqMavenPluginVersionChoice: 'latest'

# 6B. Ordinary Maven build and tests on feature branches and PRs
- task: Maven@4
  displayName: 'Maven build and unit tests (without SonarQube)'
  condition: and(succeeded(), ne(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    mavenPomFile: 'pom.xml'
    goals: 'clean verify'
    options: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'
    publishJUnitResults: false
    javaHomeOption: 'JDKVersion'
    jdkVersionOption: '1.21'
    mavenVersionOption: 'Default'
    mavenAuthenticateFeed: false
    effectivePomSkip: false
    sonarQubeRunAnalysis: false

# 7. Publish SonarQube Quality Gate ONLY on main
- task: SonarCloudPublish@4
  displayName: 'Publish SonarQube Quality Gate'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  inputs:
    pollingTimeoutSec: '300'

# 8. Publish JUnit results
- task: PublishTestResults@2
  displayName: 'Publish JUnit test results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    searchFolder: '$(Build.SourcesDirectory)'
    mergeTestResults: true
    failTaskOnFailedTests: true
    testRunTitle: 'CloudForge Maven Tests'

# 9. Publish Maven test reports
- task: PublishPipelineArtifact@1
  displayName: 'Publish Maven test reports'
  condition: succeededOrFailed()
  inputs:
    targetPath: '$(Build.SourcesDirectory)/target/surefire-reports'
    artifact: 'maven-test-reports'
    publishLocation: 'pipeline'

# 10. Build Docker image
- script: |
    docker build -t $(DOCKER_IMAGE) .
  displayName: 'Build CloudForge Docker image'

# 11. Validate Docker image
- script: |
    docker image inspect $(DOCKER_IMAGE)
    docker images $(DOCKER_IMAGE)
  displayName: 'Validate Docker image'

# 12. Push image to GHCR (main only, explicitly enabled)
- script: |
    echo "$GHCR_PAT" | docker login ghcr.io \
      -u "$(GHCR_USER)" --password-stdin

    docker tag $(DOCKER_IMAGE) $(GHCR_IMAGE):$(Build.SourceVersion)
    docker tag $(DOCKER_IMAGE) $(GHCR_IMAGE):latest

    docker push $(GHCR_IMAGE):$(Build.SourceVersion)
    docker push $(GHCR_IMAGE):latest
  displayName: 'Push Docker image to GitHub Container Registry'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['ENABLE_GHCR_PUBLISH'], 'true'))
  env:
    GHCR_PAT: $(GHCR_PAT)

# 13. Deploy to Kubernetes ONLY when explicitly enabled
- task: SSH@0
  displayName: 'Deploy CloudForge to Kubernetes'
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'), eq(variables['ENABLE_K8S_DEPLOYMENT'], 'true'))
  inputs:
    sshEndpoint: 'CloudForge-VM-SSH'
    runOptions: 'commands'
    commands: |
      sudo kubectl set image deployment/cia2-java-app java-web=ghcr.io/pradita-01/cloudforge:$(Build.SourceVersion)
      sudo kubectl set env deployment/cia2-java-app APP_VERSION=$(Build.SourceVersion)
      sudo kubectl rollout status deployment/cia2-java-app --timeout=180s
      sudo kubectl get deployments
      sudo kubectl get pods -o wide
