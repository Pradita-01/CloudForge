
# CloudForge - Azure DevOps CI Pipeline

trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  JAVA_VERSION: '21'
  MAVEN_CACHE_FOLDER: $(Pipeline.Workspace)/.m2/repository
  DOCKER_IMAGE: cloudforge:$(Build.BuildId)

steps:

# 1. Checkout source code with complete Git history
- checkout: self
  fetchDepth: 0
  displayName: 'Checkout CloudForge source'

# 2. Configure Java 21
- task: JavaToolInstaller@0
  displayName: 'Set up JDK 21'
  inputs:
    versionSpec: '21'
    jdkArchitectureOption: 'x64'
    jdkSourceOption: 'PreInstalled'

# 3. Cache Maven dependencies
- task: Cache@2
  displayName: 'Cache Maven dependencies'
  inputs:
    key: 'maven | "$(Agent.OS)" | pom.xml'
    restoreKeys: |
      maven | "$(Agent.OS)"
    path: $(MAVEN_CACHE_FOLDER)

# 4. Install and execute Gitleaks
- script: |
    docker run --rm \
      -v "$(Build.SourcesDirectory):/repo" \
      ghcr.io/gitleaks/gitleaks:v8.24.3 \
      detect --source=/repo --redact --verbose --exit-code 1
  displayName: 'Gitleaks secret scanning'

# 5. Build, test and package using Maven
- script: |
    mvn --batch-mode --no-transfer-progress clean verify
  displayName: 'Maven build and unit tests'
  env:
    MAVEN_OPTS: '-Dmaven.repo.local=$(MAVEN_CACHE_FOLDER)'

# 6. Publish Maven test results
- task: PublishTestResults@2
  displayName: 'Publish JUnit test results'
  condition: succeededOrFailed()
  inputs:
    testResultsFormat: 'JUnit'
    testResultsFiles: '**/surefire-reports/TEST-*.xml'
    searchFolder: '$(Build.SourcesDirectory)'
    mergeTestResults: true
    failTaskOnFailedTests: true
    testRunTitle: 'CloudForge Maven Tests'

# 7. Publish test reports as pipeline artifacts
- task: PublishPipelineArtifact@1
  displayName: 'Publish Maven test reports'
  condition: succeededOrFailed()
  inputs:
    targetPath: '$(Build.SourcesDirectory)/target/surefire-reports'
    artifact: 'maven-test-reports'
    publishLocation: 'pipeline'

# 8. Build Docker image (local to the hosted agent)
- script: |
    docker build -t $(DOCKER_IMAGE) .
  displayName: 'Build CloudForge Docker image'

# 9. Validate Docker image
- script: |
    docker image inspect $(DOCKER_IMAGE)
    docker images $(DOCKER_IMAGE)
  displayName: 'Validate Docker image'
